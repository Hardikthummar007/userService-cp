<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>1v1 Battle - Phase 2 Matchmaking Tester</title>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 30px;
      margin: 0;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      margin-top: 0;
      color: #38bdf8;
      font-size: 24px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
      color: #94a3b8;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-size: 14px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
    }
    .btn-primary { background: #38bdf8; color: #0f172a; }
    .btn-primary:hover { background: #0284c7; color: #ffffff; }
    .btn-success { background: #22c55e; color: #0f172a; }
    .btn-success:hover { background: #16a34a; color: #ffffff; }
    .btn-warning { background: #f59e0b; color: #0f172a; }
    .btn-warning:hover { background: #d97706; color: #ffffff; }
    .btn-danger { background: #ef4444; color: #ffffff; }
    .btn-danger:hover { background: #dc2626; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      margin-left: 10px;
    }
    .badge-disconnected { background: #ef4444; color: white; }
    .badge-connected { background: #22c55e; color: #0f172a; }
    .badge-queue { background: #f59e0b; color: #0f172a; }
    .badge-matched { background: #8b5cf6; color: white; }
    .box-match {
      margin-top: 18px;
      padding: 16px;
      border-radius: 8px;
      background: #090d16;
      border: 1px solid #3b82f6;
      display: none;
    }
    .box-match h3 {
      margin: 0 0 10px 0;
      color: #60a5fa;
    }
    #logs {
      margin-top: 18px;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 14px;
      height: 240px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.5;
    }
    .log-info { color: #38bdf8; }
    .log-success { color: #4ade80; }
    .log-warn { color: #facc15; }
    .log-error { color: #f87171; }
  </style>
</head>
<body>
<div class="container">
  <h1>1v1 Battle - Phase 2 Matchmaking
    <span id="statusBadge" class="badge badge-disconnected">DISCONNECTED</span>
    <span id="queueBadge" class="badge badge-queue" style="display: none;">IN QUEUE</span>
  </h1>

  <div class="form-group">
    <label for="usernameInput">Username (open 2 browser tabs with e.g. player1 and player2):</label>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="usernameInput" value="player1" />
      <button class="btn-primary" onclick="generateToken()">Generate Token</button>
    </div>
  </div>

  <div class="form-group">
    <label for="tokenInput">JWT Token:</label>
    <input type="text" id="tokenInput" placeholder="Click 'Generate Token'" />
  </div>

  <div class="btn-group">
    <button class="btn-success" id="connectBtn" onclick="connect()">Connect STOMP (/ws)</button>
    <button class="btn-danger" id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
    <button class="btn-warning" id="findMatchBtn" onclick="findMatch()" disabled>Find Match (/app/battle/join)</button>
    <button style="background: #64748b; color: white;" id="leaveMatchBtn" onclick="leaveMatch()" disabled>Leave Queue (/app/battle/leave)</button>
    <button style="background: #334155; color: #94a3b8;" onclick="clearLogs()">Clear Logs</button>
  </div>

  <div id="matchCard" class="box-match">
    <h3>MATCH FOUND!</h3>
    <div><strong>Battle ID:</strong> <span id="mBattleId" style="color: #38bdf8;"></span></div>
    <div><strong>Opponent:</strong> <span id="mOpponent" style="color: #4ade80;"></span></div>
  </div>

  <div id="logs"></div>
</div>

<script>
  let stompClient = null;

  function log(message, type = 'info') {
    const logs = document.getElementById('logs');
    const entry = document.createElement('div');
    entry.className = `log-${type}`;
    const timestamp = new Date().toLocaleTimeString();
    entry.textContent = `[${timestamp}] ${message}`;
    logs.appendChild(entry);
    logs.scrollTop = logs.scrollHeight;
  }

  function clearLogs() {
    document.getElementById('logs').innerHTML = '';
  }

  function setStatus(connected, user = '') {
    const badge = document.getElementById('statusBadge');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const findMatchBtn = document.getElementById('findMatchBtn');
    const leaveMatchBtn = document.getElementById('leaveMatchBtn');

    if (connected) {
      badge.textContent = `CONNECTED (${user})`;
      badge.className = 'badge badge-connected';
      connectBtn.disabled = true;
      disconnectBtn.disabled = false;
      findMatchBtn.disabled = false;
      leaveMatchBtn.disabled = true;
    } else {
      badge.textContent = 'DISCONNECTED';
      badge.className = 'badge badge-disconnected';
      document.getElementById('queueBadge').style.display = 'none';
      document.getElementById('matchCard').style.display = 'none';
      connectBtn.disabled = false;
      disconnectBtn.disabled = true;
      findMatchBtn.disabled = true;
      leaveMatchBtn.disabled = true;
    }
  }

  async function generateToken() {
    const username = document.getElementById('usernameInput').value.trim() || 'player1';
    try {
      log(`Requesting test token for '${username}'...`);
      const resp = await fetch(`/onev1Service/generateTestToken?username=${encodeURIComponent(username)}`);
      const data = await resp.json();
      document.getElementById('tokenInput').value = data.token;
      log(`Generated JWT token for user '${data.username}'`, 'success');
    } catch (err) {
      log(`Error generating token: ${err.message}`, 'error');
    }
  }

  function connect() {
    const token = document.getElementById('tokenInput').value.trim();
    if (!token) {
      log('Please generate or paste a JWT token first!', 'warn');
      return;
    }

    log('Opening SockJS connection to http://localhost:8084/ws ...');
    const socket = new SockJS('/ws');
    stompClient = Stomp.over(socket);
    stompClient.debug = function(str) {};

    const headers = {
      'Authorization': 'Bearer ' + token
    };

    log('Sending STOMP CONNECT frame with Bearer token...');

    stompClient.connect(headers, function(frame) {
      const username = document.getElementById('usernameInput').value.trim() || 'user';
      log(`Connected to STOMP broker as: ${username}`, 'success');
      setStatus(true, username);

      // Subscribe to user queue for match notifications
      log(`Subscribing to private queue /user/queue/match ...`);
      stompClient.subscribe('/user/queue/match', function(message) {
        log(`RECEIVED MATCH NOTIFICATION: ${message.body}`, 'success');
        try {
          const data = JSON.parse(message.body);
          if (data.type === 'MATCH_FOUND') {
            document.getElementById('queueBadge').style.display = 'none';
            document.getElementById('matchCard').style.display = 'block';
            document.getElementById('mBattleId').textContent = data.battleId;
            document.getElementById('mOpponent').textContent = data.opponent;
            document.getElementById('findMatchBtn').disabled = true;
            document.getElementById('leaveMatchBtn').disabled = true;
            log(`Successfully paired with opponent '${data.opponent}' in Battle #${data.battleId}!`, 'success');
          }
        } catch (e) {
          log(`Failed to parse match payload: ${e.message}`, 'error');
        }
      });

    }, function(error) {
      log(`STOMP connection error: ${error}`, 'error');
      setStatus(false);
    });
  }

  function disconnect() {
    if (stompClient !== null) {
      stompClient.disconnect(function() {
        log('Disconnected from STOMP broker.', 'info');
        setStatus(false);
      });
    }
  }

  function findMatch() {
    if (!stompClient || !stompClient.connected) {
      log('Not connected to WebSocket!', 'error');
      return;
    }
    log('Sending /app/battle/join ...');
    stompClient.send('/app/battle/join', {}, JSON.stringify({}));
    document.getElementById('queueBadge').style.display = 'inline-block';
    document.getElementById('findMatchBtn').disabled = true;
    document.getElementById('leaveMatchBtn').disabled = false;
    log('Joined matchmaking queue. Waiting for opponent...', 'info');
  }

  function leaveMatch() {
    if (!stompClient || !stompClient.connected) {
      return;
    }
    log('Sending /app/battle/leave ...');
    stompClient.send('/app/battle/leave', {}, JSON.stringify({}));
    document.getElementById('queueBadge').style.display = 'none';
    document.getElementById('findMatchBtn').disabled = false;
    document.getElementById('leaveMatchBtn').disabled = true;
    log('Left matchmaking queue.', 'warn');
  }

  window.onload = function() {
    // Generate a default unique username if opening multiple tabs
    const randomNum = Math.floor(Math.random() * 900) + 100;
    document.getElementById('usernameInput').value = 'player_' + randomNum;
    generateToken();
  };
</script>
</body>
</html>
